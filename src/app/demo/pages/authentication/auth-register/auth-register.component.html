<div class="auth-main">
  <div class="auth-container">
    <div class="text-center mb-4">
      @if (!logoError) {
        <img src="/assets/images/svg/logo-ar.svg" (error)="onLogoError()" alt="Special Cards Logo" style="height: 60px; max-width: 240px; object-fit: contain;" />
      } @else {
        <div class="d-inline-flex align-items-center gap-2 px-4 py-2 rounded-pill shadow" style="background: linear-gradient(135deg, #111625 0%, #0B0F19 100%); border: 1px solid rgba(245, 158, 11, 0.4);">
          <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 42px; height: 42px; background: linear-gradient(135deg, #F6E4B8 0%, #D8AE5E 50%, #8A6526 100%); color: #0E131F;">
            SC
          </div>
          <span class="fw-bold fs-4 text-gold" style="color: #F59E0B !important;">Special Cards</span>
        </div>
      }
    </div>

    <div class="auth-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0 fw-bold text-dark">تسجيل مستخدم جديد</h3>
        <a [routerLink]="['/login']" class="text-gold fw-bold text-decoration-none small">تسجيل الدخول</a>
      </div>

      <form (ngSubmit)="register()">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold text-dark small" for="fullName">الاسم الكامل*</label>
          <input type="text" class="form-control form-control-lg" id="fullName" name="fullName" placeholder="الاسم الثلاثي" [(ngModel)]="fullName" required />
        </div>

        <div class="mb-3 text-start">
          <label class="form-label fw-bold text-dark small" for="emailAddress">البريد الإلكتروني*</label>
          <input type="email" class="form-control form-control-lg" id="emailAddress" name="email" placeholder="user@specialcards.sa" [(ngModel)]="email" required />
        </div>

        <div class="mb-4 text-start">
          <label class="form-label fw-bold text-dark small" for="password">كلمة المرور*</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" [(ngModel)]="password" required />
        </div>

        @if (error) {
          <div class="alert alert-danger mb-3 py-2 small">{{ error }}</div>
        }
        @if (success) {
          <div class="alert alert-success mb-3 py-2 small">{{ success }}</div>
        }

        <button type="submit" class="btn btn-gold btn-lg w-100 fw-bold justify-content-center" [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          إنشاء الحساب
        </button>
      </form>
    </div>

    <div class="text-center mt-4">
      <p class="m-0 text-white-50 small">&copy; 2026 Special Cards | مؤسسة بطاقتي الخاصة</p>
    </div>
  </div>
</div>
