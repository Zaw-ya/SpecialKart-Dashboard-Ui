<div class="auth-main" style="background: linear-gradient(135deg, #14172A 0%, #0F1120 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div class="auth-wrapper" style="width: 100%; max-width: 480px;">
    <div class="auth-form text-center">
      <div class="auth-header mb-4">
        <img src="/assets/images/svg/logo-ar.svg" alt="Special Cards Logo" style="height: 52px; max-width: 220px; object-fit: contain;" />
      </div>
      <div class="card shadow-lg border-0" style="background: #FBF8F1; border-radius: 16px;">
        <div class="card-body p-4 p-md-5 text-start">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0 fw-bold text-dark">تسجيل مستخدم جديد</h3>
            <a [routerLink]="['/login']" class="text-gold fw-bold text-decoration-none small">تسجيل الدخول</a>
          </div>
          <form (ngSubmit)="register()">
            <div class="form-group mb-3">
              <label class="form-label fw-bold text-dark" for="fullName">الاسم الكامل*</label>
              <input type="text" class="form-control form-control-lg" id="fullName" name="fullName" placeholder="الاسم الثلاثي" [(ngModel)]="fullName" required />
            </div>
            <div class="form-group mb-3">
              <label class="form-label fw-bold text-dark" for="emailAddress">البريد الإلكتروني*</label>
              <input type="email" class="form-control form-control-lg" id="emailAddress" name="email" placeholder="user@specialcards.sa" [(ngModel)]="email" required />
            </div>
            <div class="form-group mb-3">
              <label class="form-label fw-bold text-dark" for="password">كلمة المرور*</label>
              <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" [(ngModel)]="password" required />
            </div>
            @if (error) {
              <div class="alert alert-danger mb-3 py-2 small">{{ error }}</div>
            }
            @if (success) {
              <div class="alert alert-success mb-3 py-2 small">{{ success }}</div>
            }
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-gold btn-lg w-100 fw-bold justify-content-center" [disabled]="loading">
                @if (loading) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                }
                إنشاء الحساب
              </button>
            </div>
          </form>
        </div>
      </div>
      <div class="auth-footer text-center mt-4">
        <p class="m-0 text-white-50 small">&copy; 2026 Special Cards | مؤسسة بطاقتي الخاصة</p>
      </div>
    </div>
  </div>
</div>
