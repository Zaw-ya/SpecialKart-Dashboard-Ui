<app-navigation
  class="pc-sidebar"
  [ngClass]="{
    'navbar-collapsed': navCollapsed,
    'mob-open': navCollapsedMob
  }"
  (NavCollapse)="this.navCollapsed = !this.navCollapsed"
/>
<app-nav-bar (NavCollapsedMob)="navMobClick()" (NavCollapse)="this.navCollapsed = !this.navCollapsed" />
<div class="pc-container">
  <div class="coded-wrapper">
    <div class="coded-content">
      <div class="coded-inner-content">
        <app-breadcrumb />
        <div class="main-body">
          <div class="page-wrapper">
            <router-outlet />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="pc-menu-overlay" (click)="closeMenu()" (keydown)="handleKeyDown($event)" tabindex="0"></div>
</div>
<app-toast />
<footer class="pc-footer">
  <div class="footer-wrapper container-fluid">
    <div class="row align-items-center">
      <div class="col my-1">
        <p class="m-0 text-white-50">
          &copy; 2026 <strong class="text-gold">Special Cards | مؤسسة بطاقتي الخاصة</strong> — جميع الحقوق محفوظة
        </p>
      </div>
      <div class="col-auto my-1">
        <ul class="list-inline footer-link mb-0">
          <li class="list-inline-item"><a [routerLink]="['/dashboard/default']">الرئيسية</a></li>
          <li class="list-inline-item"><a [routerLink]="['/orders']">الطلبات</a></li>
          <li class="list-inline-item"><a [routerLink]="['/site-settings']">الإعدادات</a></li>
        </ul>
      </div>
    </div>
  </div>
</footer>
