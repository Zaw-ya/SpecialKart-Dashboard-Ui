<ul class="list-unstyled d-flex align-items-center mb-0 gap-2">
  <li class="pc-h-item pc-sidebar-collapse">
    <a
      title="تبديل القائمة"
      class="btn btn-icon text-white d-flex align-items-center justify-content-center"
      style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); width: 38px; height: 38px; border-radius: 8px;"
      [ngClass]="{ on: navCollapsed() }"
      id="sidebar-hide mobile-collapse"
      (click)="navCollapse()"
      aria-label="Toggle Sidebar"
    >
      <i class="ti fs-5 text-white" [ngClass]="navCollapsed() ? 'ti-layout-sidebar-right-expand' : 'ti-layout-sidebar-left-collapse'"></i>
    </a>
  </li>
  <li class="pc-h-item pc-sidebar-popup">
    <a 
      class="btn btn-icon text-white d-flex align-items-center justify-content-center"
      style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); width: 38px; height: 38px; border-radius: 8px;"
      id="mobile-collapse1" 
      (click)="navCollapsedMob()"
      aria-label="Mobile Navigation"
    >
      <i class="ti ti-menu-2 fs-5 text-white"></i>
    </a>
  </li>
  <li class="pc-h-item d-none d-md-inline-flex ms-2">
    <form class="header-search position-relative">
      <i class="ti ti-search position-absolute top-50 start-0 translate-middle-y ms-3 text-white-50 fs-6"></i>
      <input type="search" class="form-control form-control-sm ps-5 rounded-pill text-white" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); width: 220px;" placeholder="بحث سريع (Ctrl + K)" />
    </form>
  </li>
</ul>
